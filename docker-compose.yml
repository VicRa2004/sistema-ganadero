services:
  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistema_ganadero_migrations
    command: ["bun", "run", "--cwd", "api", "scripts/migrate.ts"]
    env_file:
      - path: .env
        required: false
    networks:
      - default
      - dokploy-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistema_ganadero_app
    expose:
      - "${PORT:-3000}"
    env_file:
      - path: .env
        required: false
    networks:
      - default
      - dokploy-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sistema_ganadero_uploads:/app/api/uploads
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  sistema_ganadero_uploads:
    name: sistema_ganadero_uploads

